name: Verify Photos web sharing
on:
  push:
    branches: [feature/live-3d-web-sharing]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: QuickTunnel/go.mod
          cache-dependency-path: QuickTunnel/go.sum
      - name: Make Go available to Xcode build phases
        run: sudo ln -sf "$(command -v go)" /usr/local/bin/go
      - name: Build and test Web Share with a seeded Photos library
        shell: bash
        run: |
          set -euo pipefail
          if ! xcrun -sdk iphonesimulator metal -v >/dev/null 2>&1; then xcodebuild -downloadComponent MetalToolchain; fi
          device=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True) if "iOS" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          args=(-project StereoShift.xcodeproj -destination "platform=iOS Simulator,id=$device" -derivedDataPath "$RUNNER_TEMP/PhotoBuild" -parallel-testing-enabled NO -collect-test-diagnostics never CODE_SIGNING_ALLOWED=NO)
          xcrun simctl addmedia "$device" "$(find StereoShiftTests -name live-preview-portrait.mp4)"
          cert=StereoShift/Resources/WebShareIdentity.p12
          if ! openssl pkcs12 -legacy -in "$cert" -clcerts -nokeys -passin pass:StereoShiftLocalWebShare > "$RUNNER_TEMP/gallery.pem" 2>/dev/null; then
            openssl pkcs12 -in "$cert" -clcerts -nokeys -passin pass:StereoShiftLocalWebShare > "$RUNNER_TEMP/gallery.pem"
          fi
          digest=$(openssl x509 -in "$RUNNER_TEMP/gallery.pem" -outform DER | shasum -a 256 | awk '{print $1}')
          export TEST_RUNNER_STEREOSHIFT_LAN_CERT_SHA256="$digest"
          xcodebuild "${args[@]}" -scheme StereoShiftUITests -only-testing:StereoShiftUITests/PhotoWebShareUITests test | tee "$RUNNER_TEMP/ui.log"
          grep -F "testGrantedPhotosLibraryServesSeededVideoThumbnail]' passed" "$RUNNER_TEMP/ui.log"
          xcodebuild "${args[@]}" -scheme StereoShiftTests -only-testing:StereoShiftTests/PhotoWebShareTests -only-testing:StereoShiftTests/LiveWebVideoTests test
